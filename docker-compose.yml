# Local Postgres for development only. Production runs on Railway or AWS RDS.
#   docker compose up -d
#   npm run db:migrate && npm run db:seed
services:
  postgres:
    image: postgres:16-alpine
    container_name: avenues-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: avenues
      POSTGRES_PASSWORD: avenues
      POSTGRES_DB: avenues
    # Host port is 5433 on purpose: 5432 is often already taken by a native
    # PostgreSQL install. Keep DATABASE_URL in .env pointed at 5433.
    ports:
      - "5433:5432"
    volumes:
      - avenues-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avenues -d avenues"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  avenues-pgdata:
