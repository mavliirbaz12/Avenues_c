name: E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 02:30 UTC ≈ 08:00 IST — the full suite lands before the working day.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full suite instead of @smoke"
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: avenues
          POSTGRES_PASSWORD: avenues
          POSTGRES_DB: avenues_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U avenues -d avenues_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      E2E_DATABASE_URL: postgresql://avenues:avenues@localhost:5433/avenues_test?schema=public
      # The suite's own values; nothing here reaches a real service.
      AUTH_SECRET: e2e-fixed-auth-secret-do-not-use-outside-tests-0000000000
      AUTH_TRUST_HOST: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The CI Postgres service is already the test database, so the
      # orchestrator's docker-exec branch is skipped; run the steps directly.
      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      - name: Seed
        run: |
          npx tsx prisma/seed.ts
          npx tsx e2e/utils/seed-test-data.ts
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          SEED_ADMIN_EMAIL: admin@test.dev
          SEED_ADMIN_PASSWORD: AdminTest!2026
          SEED_ADMIN_NAME: Test Admin

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      # Smoke on every PR/push; the full suite nightly or on demand.
      - name: Run E2E
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full }}" = "true" ]; then
            npx playwright test
          else
            npx playwright test --grep @smoke
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: e2e/.artifacts/
          retention-days: 14
